  <style>
    circle, path { transform-box: fill-box; transform-origin: center; transform: scale(1.05); }
    circle, path { animation: twinkle 6s ease-in-out infinite; }
    :is(circle, path):nth-child(3n) { animation-duration: 8s; animation-delay: -4s; }
    :is(circle, path):nth-child(3n + 1) { animation-duration: 7s; animation-delay: -5s; }
    :is(circle, path):nth-child(3n + 2) { animation-delay: -2s; }
    @keyframes twinkle {
      0%, 100% { opacity: calc(var(--peak-opacity, 1) * .45); }
      50% { opacity: var(--peak-opacity, 1); }
    }
    @media (prefers-reduced-motion: reduce) {
      circle, path { animation: none; }
    }
  </style>
