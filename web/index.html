<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Set the theme before styles and React load to avoid a light-theme flash.
      (() => {
        let preference;
        try { preference = localStorage.getItem("avision.theme"); } catch {}
        document.documentElement.dataset.theme =
          preference === "light" || preference === "dark"
            ? preference
            : window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      })();
    </script>
    <title>AVision | Atlanta accessibility map</title>
    <meta name="description" content="Streamline ticket management with a user-friendly interface featuring onboarding, map and list views for issues, and a profile page for tracking user tickets." />
    <!-- Kept out of search engines for now; public/robots.txt says the same. -->
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" href="/logo.svg" />
    <meta property="og:title" content="AVision | Atlanta accessibility map" />
    <meta property="og:description" content="Streamline ticket management with a user-friendly interface featuring onboarding, map and list views for issues, and a profile page for tracking user tickets." />
    <!-- Google AdSense. The publisher id comes from VITE_ADSENSE_CLIENT at build time
         (see src/AdSlot.tsx); without it, nothing loads. Paste the same id into
         AdSense's "add your site" step, which only needs this script present. -->
    <script type="module">
      const client = (import.meta.env.VITE_ADSENSE_CLIENT ?? "").trim()
      if (client) {
        const s = document.createElement("script")
        s.async = true
        s.crossOrigin = "anonymous"
        s.src = `https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=${encodeURIComponent(client)}`
        document.head.appendChild(s)
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
