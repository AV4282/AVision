<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Set the theme before styles and React load to avoid a light-theme flash.
      (() => {
        let preference;
        try { preference = localStorage.getItem("avision.theme"); } catch {}
        document.documentElement.dataset.theme =
          preference === "light" || preference === "dark"
            ? preference
            : window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      })();
    </script>
    <title>AVision | Atlanta accessibility map</title>
    <meta name="description" content="Streamline ticket management with a user-friendly interface featuring onboarding, map and list views for issues, and a profile page for tracking user tickets." />
    <link rel="icon" href="/logo.svg" />
    <meta property="og:title" content="AVision | Atlanta accessibility map" />
    <meta property="og:description" content="Streamline ticket management with a user-friendly interface featuring onboarding, map and list views for issues, and a profile page for tracking user tickets." />

     crossorigin="anonymous"></script>
  </head>

  </body>
</html>
